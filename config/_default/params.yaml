# Site features
features:
  avatar:
    enable: true
    gravatar: false
    # shape: circle # Options: circle, square
  comment:
    provider: "disqus" # Ensure disqus is configured in config.yaml services
    enable: true
    # commentable: # Which sections allow comments?
    #   post: true
    #   book: true
    #   project: true
    #   publication: true
    #   event: true
    # disqus:
    #   shortname: "giuliano-mega" # Already in config.yaml
      # show_count: true # Old comment_count
  math:
    enable: false # Old global math setting
  privacy_pack:
    enable: false # Old privacy_pack setting
  repository:
    url: "https://github.com/<USERNAME>/<PROJECT_NAME>" # Replace with actual repo URL if available
    content_dir: content
    branch: main # or master
  # search: # Search configuration
  #   provider: wowchemy # or algolia
  #   algolia:
  #     app_id: ""
  #     api_key: ""
  #     index_name: ""
  #     show_logo: false
  sharing:
    enable: true # Old 'sharing' setting
    # AddThis: # Optional AddThis integration
    #   id: ""
  # blog: # Settings for blog posts
  #   reading_time: true # Old 'reading_time'
  #   # words_per_minute: 200
  publications: # Settings for publications
    citation_style: "mla" # apa (default), mla, ieee, harvard, vancouver. Old 'publication_format' needs mapping
  #   # detailed_list: true # Show detailed publication list on home page etc.
  # projects:
  #   # detailed_list: true # Show detailed project list
  # talks:
  #   # detailed_list: true # Show detailed talk list

# Social media links. Replaces [[params.social]]
social:
  - icon: envelope
    icon_pack: fas # Font Awesome Solid (fas), Regular (far), Brands (fab)
    link: "mailto:giuliano.mega@gmail.com"
  - icon: linkedin
    icon_pack: fab
    link: "//www.linkedin.com/in/giuliano-mega-0433249b"
  - icon: github
    icon_pack: fab
    link: "//github.com/gmega"
  - icon: orcid
    icon_pack: ai # Academicons
    link: "https://orcid.org/0000-0002-4994-2387"
  # - icon: google-scholar # Example, if it was used
  #   icon_pack: ai
  #   link: "https://scholar.google.co.uk/citations?user=sIwtMXoAAAAJ"

# Publication types. Replaces params.publication_types
# This structure is standard for Wowchemy.
publication_types:
  - name: Uncategorized
    tag: 0
  - name: Conference paper
    tag: 1
  - name: Journal article
    tag: 2
  - name: Manuscript
    tag: 3
  - name: Report
    tag: 4
  - name: Book
    tag: 5
  - name: Book section
    tag: 6

# Old params.talks, params.publications, params.projects specific settings
# These are likely handled by features above or by page front matter/layouts now.
# For example, `params.talks.time = true` might be a front matter option on individual talks or a layout detail.
# `params.publications.date_format` will use global `date_format` or page-specific.
# `params.projects.list_children` is widget/layout dependent.
# `params.projects.publication_format` is `features.publications.citation_style`.

