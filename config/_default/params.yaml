# Site Params
# These are parameters migrated from the [params] section of config.toml
# Some may need adjustment for Wowchemy v5.

# theme: default # Old color_theme. Wowchemy uses theme sets e.g. minimal, forest. Default is usually fine.
# font_size: M # Old font. Wowchemy has font_size options S, M, L and font_family.
# color_theme has been replaced by a more comprehensive 'theme' system in Wowchemy.
# Example: theme: minimal (Wowchemy default). User can choose from available themes.
# Font style 'font' is also replaced by font_family and font_size settings.
# Example: font_family: "Montserrat" (default), font_size: M

